# Render Blueprint. A free PostgreSQL database expires after 30 days.
databases:
  - name: warehouse-db
    plan: free
    databaseName: warehouse
    user: warehouse

services:
  - type: web
    name: warehouse-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: iitb-zeip.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://warehouse-ui.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: EVAL_ADMIN_PASSWORD
        sync: false
      - key: EVAL_AUDITOR_PASSWORD
        sync: false
      - key: EVAL_TECHNICIAN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false   # sender on a verified Resend domain
      - key: LOW_BATTERY_ALERT_TO
        sync: false   # default recipient for automatic alerts
      - key: FRONTEND_URL
        sync: false   # e.g. https://iitb-frontend.vercel.app
      - key: PASSWORD_RESET_URL
        sync: false   # e.g. https://iitb-frontend.vercel.app/reset-password
