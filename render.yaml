# Render Blueprint (free plan, no card). Database: SQLite file at SQLITE_PATH.
services:
  - type: web
    name: warehouse-api
    runtime: python
    plan: free
    rootDir: warehouse-api
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: iitb-zeip.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://warehouse-ui.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SQLITE_PATH
        value: /opt/render/project/src/db.sqlite3
      - key: EVAL_ADMIN_PASSWORD
        sync: false
      - key: EVAL_AUDITOR_PASSWORD
        sync: false
      - key: EVAL_TECHNICIAN_PASSWORD
        sync: false
